<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Penalty Shootout Online</title>
  <link rel="stylesheet" href="style.css">
  <!-- تلگرام SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div class="app-container">
    
    <!-- لابی / صفحه انتظار -->
    <div id="lobby-screen" class="screen active">
      <div class="lobby-bg">
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
      </div>
      <div class="glass-card lobby-card">
        <div class="lobby-logo">⚽</div>
        <h1 class="glow-title">ضربات پنالتی</h1>
        <p class="subtitle">دوئل آنلاین ۱ به ۱ — شوت بزن یا دروازه‌بانی کن</p>
        
        <div id="create-section">
          <button id="btn-create" class="btn-primary">ایجاد مسابقه جدید</button>
        </div>

        <!-- لیست مسابقه‌های عمومی در انتظار حریف -->
        <div id="public-rooms" class="hidden">
          <div class="public-rooms-header">
            <span>🔥 مسابقه‌های فعال</span>
            <span class="live-dot"></span>
          </div>
          <div id="public-rooms-items"></div>
        </div>

        <div id="waiting-section" class="hidden">
          <div class="loader"></div>
          <p class="waiting-text">در انتظار حریف...</p>
          <div class="invite-box">
            <input type="text" id="invite-link" readonly>
            <button id="btn-copy" class="btn-secondary">📤 ارسال لینک به دوستت</button>
          </div>
        </div>
      </div>
    </div>

    <!-- زمین بازی -->
    <div id="game-screen" class="screen">
      <div class="game-bg"></div>

      <!-- هدر و اسکوربورد -->
      <div class="scoreboard glass-panel">
        <div class="player p1">
          <div id="p1-avatar" class="avatar">پ</div>
          <div class="player-meta">
            <span id="p1-name" class="name">بازیکن ۱</span>
            <div id="dots-p1" class="dots"></div>
          </div>
          <span id="p1-score" class="score">۰</span>
        </div>
        <div class="round-badge">
          <span id="round-text">ضربه ۱/۵</span>
        </div>
        <div class="player p2">
          <span id="p2-score" class="score">۰</span>
          <div class="player-meta">
            <span id="p2-name" class="name">بازیکن ۲</span>
            <div id="dots-p2" class="dots"></div>
          </div>
          <div id="p2-avatar" class="avatar">ب</div>
        </div>
      </div>

      <!-- استادیوم -->
      <div class="stadium">
        <!-- آسمان و جایگاه تماشاچی‌ها -->
        <div class="stands">
          <div class="crowd"></div>
          <div class="stand-shade"></div>
        </div>

        <!-- چمن -->
        <div class="pitch">
          <div class="pitch-stripes"></div>
          <div class="penalty-box"></div>
          <div class="penalty-arc"></div>

          <!-- دروازه -->
          <div class="goal-post">
            <div class="crossbar"></div>
            <div class="net-grid"></div>
            <div class="net-shade"></div>

            <!-- دروازه‌بان -->
            <div id="goalkeeper" class="goalkeeper">
              <div class="keeper-body"></div>
              <div class="keeper-glove g-left"></div>
              <div class="keeper-glove g-right"></div>
            </div>

            <!-- دکمه‌های هدف‌گیری روی دروازه -->
            <div class="target-zones" dir="ltr">
              <button class="target-btn" data-dir="left"><span>چپ</span></button>
              <button class="target-btn" data-dir="center"><span>وسط</span></button>
              <button class="target-btn" data-dir="right"><span>راست</span></button>
            </div>
          </div>

          <!-- توپ واقعی (CSS) -->
          <div id="ball" class="ball">
            <div class="ball-shadow"></div>
          </div>
        </div>
      </div>

      <!-- وضعیت نوبت و راهنما -->
      <div class="action-panel glass-panel">
        <div id="role-chip" class="role-chip">⚽</div>
        <div class="action-texts">
          <h3 id="role-status">نقش شما: در حال بارگذاری...</h3>
          <p id="sub-status">یکی از جهات دروازه را انتخاب کنید</p>
        </div>
      </div>

      <div class="game-actions">
        <button id="btn-rematch" class="btn-primary rematch-btn hidden">🔄 بازی مجدد</button>
        <button id="btn-leave" class="btn-secondary leave-btn">↩️ بازگشت به لابی</button>
      </div>
    </div>

    <!-- پاپ‌آپ نتیجه راند / برد و باخت -->
    <div id="result-modal" class="modal hidden">
      <div class="modal-content glass-card">
        <div id="modal-emoji" class="modal-emoji">⚽</div>
        <h2 id="modal-title">گل شد! 🔥</h2>
        <p id="modal-desc">شوت شما دور از دست گلر وارد دروازه شد.</p>
      </div>
    </div>

    <!-- فلاش رنگی گل / مهار -->
    <div id="flash" class="flash"></div>

  </div>

  <script src="game.js"></script>
</body>
</html>
